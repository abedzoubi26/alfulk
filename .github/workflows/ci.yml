name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on the same branch are pointless; cancel them. `main` is
# never cancelled, so every merged commit keeps a complete CI record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pinned so the resolver itself is part of the reproducible set. The
  # container image (F2) must use this same version.
  UV_VERSION: "0.13.7"

jobs:
  lock:
    name: Lockfile up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: uv lock --check
        # Fails when pyproject.toml has moved on without `uv lock` being
        # re-run. Every other job also passes `--locked`; this one exists so
        # the reason shows up as a named red check instead of as an install
        # failure.
        run: uv lock --check

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the interpreter pinned by .python-version
        run: uv python install

      - name: Install locked dependencies
        # `--locked` refuses to resolve: it installs exactly what uv.lock
        # records, or it fails. Putting .venv/bin on PATH lets the rest of
        # the job call tools by name.
        run: |
          uv sync --extra dev --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check --diff .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # A real PostgreSQL, not SQLite: constraint, transaction and locking
      # behaviour differ in exactly the places identity logic relies on.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alfulk
          POSTGRES_PASSWORD: alfulk
          POSTGRES_DB: alfulk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alfulk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://alfulk:alfulk@localhost:5432/alfulk_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the interpreter pinned by .python-version
        run: uv python install

      - name: Install locked dependencies
        run: |
          uv sync --extra dev --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check for missing migrations
        # Catches a model changed without a migration, which is the most
        # common way a Django branch breaks main after merge.
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: coverage run manage.py test --verbosity 2

      - name: Coverage
        # A ratchet, not an aspiration: raise this as the suite grows, never
        # lower it to make a pull request pass.
        run: coverage report --fail-under=80

  deploy-check:
    name: Production settings check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      # Throwaway values of realistic shape. This job never touches a
      # database or a network; it only inspects the configuration we ship.
      SECRET_KEY: ci-only-placeholder-key-of-sufficient-length-to-satisfy-checks-0123456789
      RECOVERY_CODE_HMAC_KEY: ci-only-placeholder-recovery-key
      DATABASE_URL: postgres://alfulk:alfulk@localhost:5432/alfulk
      ALLOWED_HOSTS: example.invalid
      # This job models *production*, where HSTS is fully enabled. The settings
      # default both to False so that preview and staging -- which share the
      # same settings module -- cannot assert `preload` for the registrable
      # domain. Set them here rather than silencing W005 and W021.
      SECURE_HSTS_SECONDS: "31536000"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
      SECURE_HSTS_PRELOAD: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the interpreter pinned by .python-version
        run: uv python install

      - name: Install locked runtime dependencies
        # No dev extra: this job checks the configuration we ship, so it
        # runs against the dependency set we ship.
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: django check --deploy
        # The only check that tests the configuration we actually ship rather
        # than the configuration the tests run under.
        run: python manage.py check --deploy --fail-level WARNING

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the interpreter pinned by .python-version
        run: uv python install

      - name: Install locked dependencies
        run: |
          uv sync --extra dev --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: pip-audit
        # Audits the installed environment, which `--locked` guarantees is
        # the locked set — so the advisory report describes the versions we
        # actually ship, not whatever the manifest ranges allow today.
        # `--skip-editable` skips alfulk itself, which is not on PyPI.
        run: pip-audit --skip-editable --progress-spinner=off

  secret-scan:
    name: Secret scan
    # Pull requests only. The scan compares a branch against its merge base,
    # which is not a meaningful range for a push to `main` — and `main`'s
    # full history was scanned clean once, during the PR #2 review.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base has to be present locally for the range scan
          # below. The repository is a few hundred kilobytes, so taking the
          # whole history costs less than reasoning about how deep is deep
          # enough.
          fetch-depth: 0

      - name: Install gitleaks
        # Not the gitleaks action: ADR-0004 requires third-party actions to
        # be pinned to a full commit SHA, and a pinned release tarball with
        # a verified checksum is a stronger guarantee than a pinned action —
        # we check what we got rather than trusting what we asked for.
        # To upgrade: bump both values together from the release's
        # gitleaks_<version>_checksums.txt.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan the commits this pull request adds
        # The shas arrive as environment variables rather than `${{ }}`
        # inside the script, so nothing from the event payload is ever
        # expanded into shell source.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # `base.sha` is the base branch tip when the pull request was last
          # synchronised, not necessarily an ancestor of the head. Scanning
          # from the merge base keeps the range to this branch's own work,
          # so an unrelated commit on the base branch cannot turn this red.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "${BASE_SHA}"
          fi
          merge_base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"

          echo "Scanning ${merge_base}..${HEAD_SHA}"

          # Exits 1 on any finding, which fails the job. `--redact` keeps the
          # secret itself out of the log: the log is readable by anyone who
          # can see the repository, and a leaked credential pasted into a
          # public build log is worse than the commit that carried it.
          gitleaks git . \
            --no-banner \
            --redact \
            --log-opts="${merge_base}..${HEAD_SHA}"
