name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on the same branch are pointless; cancel them. `main` is
# never cancelled, so every merged commit keeps a complete CI record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pinned so the resolver itself is part of the reproducible set. The
  # container image (F2) must use this same version.
  UV_VERSION: "0.13.7"

jobs:
  lock:
    name: Lockfile up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: uv lock --check
        # Fails when pyproject.toml has moved on without `uv lock` being
        # re-run. Every other job also passes `--locked`; this one exists so
        # the reason shows up as a named red check instead of as an install
        # failure.
        run: uv lock --check

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the interpreter pinned by .python-version
        run: uv python install

      - name: Install locked dependencies
        # `--locked` refuses to resolve: it installs exactly what uv.lock
        # records, or it fails. Putting .venv/bin on PATH lets the rest of
        # the job call tools by name.
        run: |
          uv sync --extra dev --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check --diff .

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      # A real PostgreSQL, not SQLite: constraint, transaction and locking
      # behaviour differ in exactly the places identity logic relies on.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alfulk
          POSTGRES_PASSWORD: alfulk
          POSTGRES_DB: alfulk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alfulk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://alfulk:alfulk@localhost:5432/alfulk_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the interpreter pinned by .python-version
        run: uv python install

      - name: Install locked dependencies
        run: |
          uv sync --extra dev --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check for missing migrations
        # Catches a model changed without a migration, which is the most
        # common way a Django branch breaks main after merge.
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: coverage run manage.py test --verbosity 2

      - name: Coverage
        # A ratchet, not an aspiration: raise this as the suite grows, never
        # lower it to make a pull request pass.
        run: coverage report --fail-under=80

  deploy-check:
    name: Production settings check
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      # Throwaway values of realistic shape. This job never touches a
      # database or a network; it only inspects the configuration we ship.
      SECRET_KEY: ci-only-placeholder-key-of-sufficient-length-to-satisfy-checks-0123456789
      RECOVERY_CODE_HMAC_KEY: ci-only-placeholder-recovery-key
      DATABASE_URL: postgres://alfulk:alfulk@localhost:5432/alfulk
      ALLOWED_HOSTS: example.invalid

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the interpreter pinned by .python-version
        run: uv python install

      - name: Install locked runtime dependencies
        # No dev extra: this job checks the configuration we ship, so it
        # runs against the dependency set we ship.
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: django check --deploy
        # The only check that tests the configuration we actually ship rather
        # than the configuration the tests run under.
        run: python manage.py check --deploy --fail-level WARNING

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the interpreter pinned by .python-version
        run: uv python install

      - name: Install locked dependencies
        run: |
          uv sync --extra dev --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: pip-audit
        # Audits the installed environment, which `--locked` guarantees is
        # the locked set — so the advisory report describes the versions we
        # actually ship, not whatever the manifest ranges allow today.
        # `--skip-editable` skips alfulk itself, which is not on PyPI.
        run: pip-audit --skip-editable --progress-spinner=off
